<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Skincare SLM</title>
  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:system-ui; margin:0; }
    .container { max-width:800px; margin:0 auto; padding:20px; }
    #chat { height:70vh; background:#1e293b; padding:15px; border-radius:12px; overflow-y:auto; }
    .msg { padding:8px 12px; margin-bottom:10px; border-radius:8px; max-width:80%; }
    .user { background:#1d4ed8; margin-left:auto; }
    .ai { background:#334155; margin-right:auto; }
    .row { display:flex; gap:10px; margin-top:10px; }
    input { flex:1; padding:10px; border-radius:8px; border:none; }
    button { padding:10px 20px; border:none; border-radius:8px; background:#22c55e; font-weight:600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Skincare SLM</h1>
    <div id="chat"></div>

    <div class="row">
      <input id="msg" placeholder="Describe your skin concern...">
      <button>Send</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
